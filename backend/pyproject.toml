[project]
name = "splendor-trainer"
version = "0.1.0"
description = "Local Splendor AI with post-game review and best-move analysis"
requires-python = ">=3.10"
# The engine core (rules/state/moves/encoding/ismcts/evaluator/notation) is pure
# stdlib — no third-party deps. Everything else is opt-in per role below.
dependencies = []

[project.optional-dependencies]
# building blocks
gcs = ["google-cloud-storage>=2.16"]          # gs:// data store
nn = ["torch>=2.2", "numpy>=1.26"]            # net + self-play tensors

# roles (install one of these)
worker = ["splendor-trainer[nn,gcs]"]         # mini-PC self-play generator (CPU)
train = ["splendor-trainer[nn,gcs]"]          # trainer (GPU/MPS)
monitor = ["splendor-trainer[gcs]"]           # status CLI only (no torch/numpy)
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]   # play/review web server

# everything for development + tests
dev = ["splendor-trainer[nn,gcs,serve]", "pytest>=8.0", "httpx>=0.27"]

# --- uv: pull the CPU-only torch wheel on Linux (mini-PC), default (MPS) on mac ---
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["splendor"]   # importable package lives at backend/splendor

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
